name: Build APK
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK from HTML
        uses: darkshredder/web-to-app-action@main
        with:
          build-folder-path: "."
          app-name: "Chronicles of the Forge"
          output-folder-path: "apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: forge-apk
          path: apk/
